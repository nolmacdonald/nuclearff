[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "nuclearff"
version = "0.1.0"
description = "Nuclear Fantasy Football"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nolan MacDonald" }]
maintainers = [{ name = "Nolan MacDonald" }]
keywords = [
    "fantasy-football",
    "nfl",
    "nflverse",
    "nflreadpy",
    "sleeper",
    "sports-analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
    "pint",
    "polars>=0.20.0",
    "duckdb>=1.0.0",
    "boto3>=1.34",
    "nflreadpy>=0.1.5",
    "requests>=2.28",
    "pydantic>=2",
    "pyyaml",
    "scikit-learn",
    "pillow",
    "opencv-python-headless",
    "imagehash",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "responses",
    "jupyter",
    "plottable>=0.1.5",
    "networkx>=3.3",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "sphinx-design",
    "myst-parser",
]

[project.scripts]
nuclearff = "nuclearff.cli:main"

[project.urls]
Homepage = "https://github.com/nolmacdonald/nuclearff"
Documentation = "https://nolmacdonald.github.io/nuclearff"
Repository = "https://github.com/nolmacdonald/nuclearff"
Issues = "https://github.com/nolmacdonald/nuclearff/issues"
Changelog = "https://github.com/nolmacdonald/nuclearff/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
module-name = "nuclearff"
module-root = "src"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Notebook cells are real, runnable CLI/URL lines, not wrappable source code.
"examples/*.ipynb" = ["E501"]
# build_notebooks.py's string literals are that same notebook-cell content,
# embedded as Python source rather than JSON -- same reasoning, same ignore.
"examples/build_notebooks.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nuclearff --cov-report=term-missing"

[tool.ty.environment]
python-version = "3.11"
