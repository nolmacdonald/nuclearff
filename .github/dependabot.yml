# Dependabot keeps Actions and Python dependencies current. Per the project
# plan, dependency updates are merged only after CI (and, once they exist,
# backtests) pass.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type::dependencies"
      - "area::ci"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type::dependencies"
      - "area::packaging"
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "ty"
          - "responses"
      docs-dependencies:
        patterns:
          - "sphinx*"
          - "pydata-sphinx-theme"
          - "myst-parser"
