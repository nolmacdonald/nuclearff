name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The lock file is authoritative: every job installs with `--frozen` so that
# dependency drift fails loudly instead of being silently resolved away.
env:
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ty type check
        run: uv run ty check src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev

      # Tests must never reach the network; HTTP is mocked with `responses`
      # and nflverse inputs come from committed fixtures.
      - name: Run pytest with coverage
        run: uv run pytest --cov=nuclearff --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify the CLI entry point is installable
        run: |
          uv run --frozen --with dist/*.whl --no-project -- nuclearff --version

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
